version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/data

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  scraper:
    build: ./backend
    command: python -m scraper.main
    env_file: .env
    profiles:
      - scraper
